# Ronda: the web app (static files) and its live rooms (one Durable Object per room code), one Worker.
# Free plan: SQLite-backed Durable Objects, static assets.
name = "ronda"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [
  { pattern = "quiz.jurisgames.com", custom_domain = true },
]

[assets]
directory = "../web"
not_found_handling = "single-page-application"
run_worker_first = ["/ws/*", "/api/*", "/health"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# new joins and failed lookups: 600 per address per minute in each Cloudflare location (index.js lookupOk): a hall of
# 500 behind one school address joins in one minute (second-pass audit R2-7: 100 turned two thirds of a hall away);
# floods of made-up names are for the host's "remove everyone who joined in the last minute"
[[ratelimits]]
name = "JOINS"
namespace_id = "2101"
simple = { limit = 600, period = 60 }

# every socket and new code per address, checked in the Worker before a room is woken (safety round 3 sweep):
# far above a real class on one network, reconnects included
[[ratelimits]]
name = "WAKES"
namespace_id = "2106"
simple = { limit = 600, period = 60 }

# the code screen's "is this code in use?" (U-R6), per address, before a room wakes: a hall of 500 fits
[[ratelimits]]
name = "PEEKS"
namespace_id = "2107"
simple = { limit = 600, period = 60 }
