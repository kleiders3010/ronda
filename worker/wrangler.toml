# Ronda: the web app (static files) and its live rooms (one Durable Object per room code), one Worker.
# Free plan: SQLite-backed Durable Objects, static assets.
name = "ronda"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [
  { pattern = "quiz.jurisgames.com", custom_domain = true },
]

[assets]
directory = "../web"
not_found_handling = "single-page-application"
run_worker_first = ["/ws/*", "/api/*", "/health"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# new joins and failed lookups: 100 per address per minute in each Cloudflare location (index.js lookupOk)
[[ratelimits]]
name = "JOINS"
namespace_id = "2101"
simple = { limit = 100, period = 60 }

# every socket and new code per address, checked in the Worker before a room is woken (safety round 3 sweep):
# far above a real class on one network, reconnects included
[[ratelimits]]
name = "WAKES"
namespace_id = "2106"
simple = { limit = 600, period = 60 }
